services:
  tailcat-socks:
    build:
      context: ..                       # repo root so COPY src/ + data/*.example resolve
      dockerfile: docker/Dockerfile
    image: yaofeng928/tailcat-socks:latest
    container_name: tailcat-socks
    # Mount the CONTAINING DIRECTORY (not the file): editors replace files on
    # save, and a file-level bind-mount pins the old inode so hot-reload would
    # miss it. A directory mount tracks the rename, so the proxy sees edits.
    #
    # The repo's data/ directory carries dns.txt, config.yaml, the client key
    # and history.db. DATA_PATH points at it, so every file the proxy reads or
    # writes lives here and history survives container recreation. Read-write
    # is deliberate: the admin page rewrites dns.txt there.
    volumes:
      - ../data:/data
    ports:
      - "1080:1080"                     # SOCKS5 for clients: --socks5-hostname <host>:1080
      - "127.0.0.1:8080:8080"           # admin page, host loopback only
    environment:
      LISTEN: "0.0.0.0:1080"            # bind all ifaces inside the container
      # The admin page has NO authentication, so the host side of the mapping
      # above is pinned to 127.0.0.1: only this host can reach it. To expose it
      # to a network, change the mapping to 8080:8080 AND put a reverse proxy
      # or firewall rule in front — the page can rewrite dns.txt.
      ADMIN_ADDR: "0.0.0.0:8080"
      DATA_PATH: "/data"                # dns.txt + config.yaml + client key + history.db
    restart: unless-stopped
    # tailcat needs to reach DERP/STUN over the network; give it outbound access.
